# Alembic configuration. The DATABASE URL is injected by alembic/env.py
# from app.config.settings.DATABASE_SYNC_URL — do not hardcode it here.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# Files generated by `alembic revision` will be named like:
#   2026_05_11_1432-ab12cd34ef56_add_users_table.py
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s
timezone = UTC

[post_write_hooks]
# (optional) hooks like black/ruff can be enabled here later

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
